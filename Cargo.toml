[workspace]
resolver = "2"
members = [
    "contracts/registry",
    "contracts/registry-tansu-manager",
    "contracts/test/*",
]

[workspace.package]
repository = "https://github.com/stellar-registry/contracts"

[workspace.dependencies]
# Cross-repo dev-dep from stellar-registry/cli
stellar-registry = "0.1.1"

soroban-sdk = "28.0.0"
admin-sep = "0.28.1"
stellar-xdr = "=28.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = true
panic = "abort"
codegen-units = 1
lto = true

[workspace.lints.clippy]
result_large_err = "allow"
