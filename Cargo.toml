[workspace]
resolver = "2"
members = [
    "contracts/registry",
    "contracts/registry-tansu-manager",
    "contracts/test/*",
]

[workspace.package]
repository = "https://github.com/stellar-registry/contracts"

[workspace.dependencies]
# Cross-repo dev-dep from stellar-registry/cli
stellar-registry = "0.0.10"

soroban-sdk = "25.3.1"
admin-sep = { git = "https://github.com/theahaco/admin-sep", rev = "46ed159ff38ee81f4b61b5ddb8ca4b6bdf972028" }
stellar-xdr = "=26.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = true
panic = "abort"
codegen-units = 1
lto = true

[workspace.lints.clippy]
result_large_err = "allow"
