[package]
name = "registry-traits"
description = "Importable soroban-sdk #[contracttrait]s for the stellar registry (deploy/publish/manage/stateless-deploy)."
version = "0.1.0"
authors = ["The Aha Company <hello@theaha.co>"]
license = "Apache-2.0"
edition = "2021"
publish = false
repository = "https://github.com/stellar-registry/contracts/tree/main/contracts/registry-traits"

[lib]
# rlib: consumed as a library by the registry contract and by downstream
# contracts (e.g. perch). No cdylib target — this crate deploys nothing itself.
crate-type = ["rlib"]
doctest = false

[dependencies]
# Version-flexible on purpose: this crate compiles against whatever soroban-sdk
# the *consuming* workspace pins (28 here, 29 downstream). The lower bound is
# 28, the first release with `Deployer::deploy_contract` and without
# `#[contracttype(export = ..)]`. The upper bound exists because of cargo's
# resolver: a range spanning two majors makes a consumer pull *two*
# soroban-sdk versions instead of unifying, so the ceiling sits at the newest
# consumer's major + 1.
soroban-sdk = { version = ">=28.0.0, <30", features = ["alloc"] }
semver = { version = "1.0.28", default-features = false }

[dev-dependencies]
soroban-sdk = { version = ">=28.0.0, <30", features = ["testutils"] }
rand = { version = "0.9.2", default-features = false, features = [
    "small_rng",
    "os_rng",
] }
