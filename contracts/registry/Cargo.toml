[package]
name = "registry"
description = "A crate for managing and deploying smart contracts on the Soroban blockchain."
version = "0.6.3"
authors = ["The Aha Company <hello@theaha.co>"]
license = "Apache-2.0"
rust-version = "1.69"
edition = "2021"
publish = false
repository = "https://github.com/stellar-registry/contracts/tree/main/contracts/registry"


[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true, features = ["alloc"] }
admin-sep = { workspace = true }
# Importable registry #[contracttrait]s + storage/name/events/error live here.
registry-traits = { path = "../registry-traits" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
stellar-registry = { workspace = true }
assert_matches = "1.5.0"
stellar-xdr = { workspace = true }
hello_world = { path = "../test/hello_world" }
immutable_hello = { path = "../test/immutable_hello" }
rand = { version = "0.9.2", default-features = false, features = [
    "small_rng",
    "os_rng",
] }


[package.metadata.stellar]
cargo_inherit = true
homepage = "theaha.co"
repository = "https://github.com/stellar-registry/contracts/tree/main/contracts/registry"
