name: Tests

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main, release/**]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: build & test contracts
    runs-on: ubuntu-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
      CI_BUILD: "--locked"
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config libudev-dev
      - run: rustup update
      - run: rustup target add wasm32v1-none
      - uses: taiki-e/install-action@just
      - uses: taiki-e/install-action@nextest
      - uses: cargo-bins/cargo-binstall@main
      - uses: stellar/stellar-cli@v26.0.0
      - name: Install stellar-scaffold (just build uses `stellar scaffold build`)
        run: cargo binstall -y stellar-scaffold-cli@0.0.24
      - uses: mozilla-actions/sccache-action@v0.0.10
      # `just test` builds the contracts (so the test wasms exist for
      # `contractimport!`) and then runs the tests, which execute in the
      # in-process Soroban test env and need no RPC node.
      - run: just test
