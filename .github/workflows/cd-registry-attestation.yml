name: Release and publish registry

# On a `registry-v<version>` tag: build the registry wasm, attach it to a GitHub
# release with build provenance, then publish it to the testnet root registry
# as the registry's smart-account author, signed by the CI delegate key.
#
# workflow_dispatch must be run from a `registry-v*` tag ref
# (`gh workflow run cd-registry-attestation.yml --ref registry-v<version>`).
on:
  push:
    tags:
      - "registry-v*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    if: startsWith(github.ref, 'refs/tags/registry-v')
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        run: echo "version=${GITHUB_REF_NAME#registry-v}" >> "$GITHUB_OUTPUT"

  # `stellar scaffold build` embeds `binver` meta from the crate version
  # (`cargo_inherit = true` in contracts/registry/Cargo.toml), which
  # registry-publish.yml checks against `version`.
  release:
    needs: version
    permissions:
      id-token: write
      contents: write
      attestations: write
    uses: stellar-registry/actions/.github/workflows/contract-release.yml@7152f7c264fcba286f01d372cb540d3b19c22834
    with:
      release_name: ${{ github.ref_name }}
      release_description: "Registry contract release"
      home_domain: "theaha.co"
      package: "registry"
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [version, release]
    permissions:
      contents: write
    uses: stellar-registry/actions/.github/workflows/registry-publish.yml@7152f7c264fcba286f01d372cb540d3b19c22834
    with:
      registry: CAAXJETKPYAATU4HVVQUTE2FFBULNFGZNEOC3MS635U5K3GZLAY2HI4M
      author: CBHPZGZJV4CPISOSWOQBDC66YOY6ESGPFZGL7M4UF3JFMMEAVOTKU5XH
      wasm_name: registry
      network: testnet
      version: ${{ needs.version.outputs.version }}
      release_tag: ${{ github.ref_name }}
      wasm_asset: registry_v${{ needs.version.outputs.version }}.wasm
      # The root registry has no `deploy_stateless`.
      deploy: false
      # The attestation is made inside the reusable build workflow above.
      attestation_signer_workflow: stellar-registry/actions/.github/workflows/contract-release.yml
    secrets:
      signing_key: ${{ secrets.CI_PUBLISH_SECRET_KEY }}
      release_token: ${{ secrets.GITHUB_TOKEN }}
